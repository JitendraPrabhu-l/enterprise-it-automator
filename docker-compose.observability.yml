# Observability add-on: Prometheus (metrics + alert rules), Alertmanager
# (routing), Grafana (provisioned datasource + dashboard), and Jaeger (a
# real trace viewer). An OVERLAY on the base compose file, so the default
# `docker compose up` stays exactly as it was — opt in with:
#
#   docker compose -f docker-compose.yml -f docker-compose.observability.yml up -d
#
# Then: Grafana http://localhost:3000 (admin / $GRAFANA_ADMIN_PASSWORD),
# Prometheus http://localhost:9090, Alertmanager http://localhost:9093,
# Jaeger UI http://localhost:16686.
#
# Tracing: this overlay points the `app` service's OTEL_EXPORTER_OTLP_ENDPOINT
# at the bundled jaeger service (below) so traces are viewable with zero
# extra config the moment this overlay is up — submit a ticket, then open
# the Jaeger UI, pick service "enterprise-it-automator", and see the actual
# span tree (classify → plan → execute_step → ... → finalize, with LLM
# token usage and MCP tool calls as child spans). Point
# OTEL_EXPORTER_OTLP_ENDPOINT at a different OTLP-HTTP target instead (a
# hosted Langfuse/LangSmith/collector) for a real deployment — this overlay
# is the local/demo default, not the only supported backend (see
# app/observability.py's module docstring).

services:
  prometheus:
    image: prom/prometheus:v3.4.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/alert-rules.yml:/etc/prometheus/alert-rules.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:v0.28.1
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
    volumes:
      - ./observability/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    ports:
      - "9093:9093"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.6.1
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD must be set — no insecure default}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    restart: unless-stopped

  # All-in-one Jaeger: OTLP receiver + storage + query UI in one container —
  # the right-sized trace backend for a local/demo stack (a real deployment
  # would point OTEL_EXPORTER_OTLP_ENDPOINT at a hosted collector instead;
  # see this file's header comment). In-memory storage only (no volume) —
  # traces don't survive a container restart, which is fine for "show me
  # what a run looks like right now," not meant as a durable trace store.
  jaeger:
    image: jaegertracing/all-in-one:1.68.0
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686" # UI
    restart: unless-stopped

  # Override: point THIS overlay's app service at the bundled Jaeger
  # instead of the unset-by-default OTEL_EXPORTER_OTLP_ENDPOINT — merges
  # with (does not replace) the base docker-compose.yml app service's own
  # `environment`/`depends_on` maps, per Compose's override-merge semantics.
  app:
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318/v1/traces
    depends_on:
      jaeger:
        condition: service_started

volumes:
  prometheus_data:
  alertmanager_data:
  grafana_data:
